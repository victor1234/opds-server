[project]
name = "opds-server"
version = "0.1.3"
description = ""
authors = [
    {name = "Kataev Viktor",email = "kataev.victor.1234@gmail.com"}
]
license = "MIT"
license-files=["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.116.1,<0.117.0",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)"
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
]

[tool.pytest.ini_options]
addopts = "--cov=opds_server --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"
